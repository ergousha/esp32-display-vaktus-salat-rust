[package]
name = "namaz-vakti"
version = "0.9.1"
edition = "2021"
license = "MIT"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "namaz-vakti"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = "0.52.1"
embedded-svc = "0.29"
embedded-hal = "1"
embedded-graphics = "0.8"
mipidsi = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
namaz-vakti-logic = { path = "logic" }
# The platform device SDK (ergousha/iot-device-sdk): enrolment with the
# ATECC608B, OTA, the platform shadow, the bench console. signed-only:
# unsigned OTA jobs are refused (plan Phase 6).
device-sdk = { git = "https://github.com/ergousha/iot-device-sdk", rev = "78edb6a145e3e6bfc3b3ba467b6e97a464e2d28d", features = ["atecc608", "signed-only"] }

[build-dependencies]
platform-build = { git = "https://github.com/ergousha/iot-device-sdk", rev = "78edb6a145e3e6bfc3b3ba467b6e97a464e2d28d" }

# Microchip CryptoAuthLib for the ATECC608B (TrustCustom). The bindings cover
# the chip calls device-sdk makes itself (its atecc module); TLS signing
# goes through esp-tls. A change here needs `cargo clean -p esp-idf-sys --release`.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-cryptoauthlib", version = "3.7.9~2" }
bindings_header = "src/atca_bindings.h"
bindings_module = "atca"
