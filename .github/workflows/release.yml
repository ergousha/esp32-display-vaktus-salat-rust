name: ESP32 Release

# Two jobs:
#
# * release-please keeps the release PR up to date from the conventional
#   commits on main and, when that PR is merged, tags the release and creates
#   the GitHub Release. It uses a GitHub App token, not GITHUB_TOKEN: GitHub
#   starts no workflows for events GITHUB_TOKEN causes, so the release PR would
#   get no CI run.
# * firmware builds the image of a new release and puts it in the platform's
#   firmware bucket under vaktus/. The upload makes the OTA Lambda of
#   iot-platform-infra create an AWS IoT Job for the vaktus fleet thing group.
#
# They are separate so a failed firmware build can be re-run on its own:
# release-please reports a release as created only once.
#
# The image carries the shared claim certificate and key from SSM. This
# repository is public, so the image goes only to the private firmware bucket:
# never to the GitHub Release, never into a cache. It carries no WiFi
# credentials; those are set on the device.

on:
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  ESPFLASH_VERSION: "4.5.0"
  ESPFLASH_SHA256: "9408208ee3d2408cd1247da61bf6e85e7611d4380c590b85e61070fe7e2bb069"

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No fallback to GITHUB_TOKEN: it would bring back release PRs without CI.
      - name: Verify release-please configuration
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || "$HAS_APP_PRIVATE_KEY" != true ]]; then
            echo "::error::Set the RELEASE_PLEASE_APP_CLIENT_ID repository variable and the RELEASE_PLEASE_APP_PRIVATE_KEY repository secret (see .github/WORKFLOWS.md, Release process)."
            exit 1
          fi

      - name: Create release-please token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write # version bump commits, tags, GitHub Releases
          permission-pull-requests: write # the release PR, its labels and comments

      # Settings in release-please-config.json, current version in
      # .release-please-manifest.json.
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  firmware:
    name: Build & deliver the firmware (OTA)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # AWS OIDC
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Verify release configuration
        env:
          AWS_FIRMWARE_BUCKET: ${{ vars.AWS_FIRMWARE_BUCKET }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" || -z "$AWS_FIRMWARE_BUCKET" ]]; then
            echo "::error::Set the AWS_ROLE_ARN and AWS_FIRMWARE_BUCKET repository variables (terraform output github_actions_role_arns / firmware_bucket_name in iot-platform-infra)."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install ESP toolchain
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          buildtargets: esp32
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # master
        with:
          swap-size-gb: 10

      - name: Install cargo-espflash
        run: |
          archive="$RUNNER_TEMP/cargo-espflash.zip"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/esp-rs/espflash/releases/download/v${ESPFLASH_VERSION}/cargo-espflash-x86_64-unknown-linux-gnu.zip"
          echo "${ESPFLASH_SHA256}  ${archive}" | sha256sum --check
          unzip -q "$archive" -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/cargo-espflash"

      # Before the build: build.rs reads the IoT endpoint, the vaktus
      # provisioning template and the claim identity from SSM with these
      # credentials (the vaktus CI role may read exactly those).
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      # An empty section: no WiFi is seeded (it is set on the device); build.rs
      # adds the SSM values.
      - name: Write cfg.toml
        run: echo '[namaz-vakti]' > cfg.toml

      - name: Build for ESP32
        run: cargo build --release

      # build.rs does not fail without SSM: it writes placeholders and builds,
      # which is right for a checkout and wrong for a release. Such an image
      # never reaches AWS IoT, so every device would roll it back. Refuse to
      # ship it. Nothing here prints a value.
      - name: Verify the image's configuration
        run: |
          fail=0
          for key in iot_endpoint provisioning_template; do
            if ! grep -Eq "^${key} = \".+\"" cfg.toml; then
              echo "::error::cfg.toml has no ${key}; the image could not connect."
              fail=1
            fi
          done
          if grep -q PLACEHOLDER certs/claim.crt.pem certs/claim.private.key; then
            echo "::error::The claim identity is a placeholder: SSM was not readable."
            fail=1
          fi
          exit "$fail"

      - name: Generate firmware image
        run: >-
          cargo espflash save-image --release --chip esp32 --flash-size 4mb
          --partition-table partitions.csv --target-app-partition ota_0 firmware.bin

      - name: Upload firmware to S3 (triggers the OTA job)
        env:
          AWS_FIRMWARE_BUCKET: ${{ vars.AWS_FIRMWARE_BUCKET }}
        run: |
          # Under the product's prefix: the OTA trigger maps vaktus/ to the
          # vaktus fleet thing group only.
          aws s3 cp firmware.bin "s3://${AWS_FIRMWARE_BUCKET}/vaktus/firmware_${TAG_NAME}.bin"
