name: ESP32 Build

# Builds the firmware for the ESP32 and checks that the image still fits an
# OTA slot of partitions.csv with room to spare.
#
# Pull requests build without AWS access, so build.rs leaves placeholders and
# the image has the cloud link off; that is fine for a compile and size check.
# The release workflow builds the image that ships.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  ESPFLASH_VERSION: "4.5.0"
  ESPFLASH_SHA256: "9408208ee3d2408cd1247da61bf6e85e7611d4380c590b85e61070fe7e2bb069"
  # Fail when the app image takes more than this share of an OTA slot: an
  # update must always fit, and the slot size is frozen in the field.
  MAX_SLOT_PERCENT: "90"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esp32-build:
    name: Build for ESP32
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install ESP toolchain
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          buildtargets: esp32
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # master
        with:
          swap-size-gb: 10

      - name: Install cargo-espflash
        run: |
          archive="$RUNNER_TEMP/cargo-espflash.zip"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/esp-rs/espflash/releases/download/v${ESPFLASH_VERSION}/cargo-espflash-x86_64-unknown-linux-gnu.zip"
          echo "${ESPFLASH_SHA256}  ${archive}" | sha256sum --check
          unzip -q "$archive" -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/cargo-espflash"

      - name: Build for ESP32
        run: cargo build --release

      - name: Build the ATECC608 bench probe
        run: cargo build --release --example atecc608_probe

      - name: Check the image fits an OTA slot
        run: |
          # The step shell is `bash -e`: a failing command substitution would
          # exit before its output is shown, so print it before failing.
          if ! out="$(cargo espflash save-image --release --chip esp32 --flash-size 4mb \
            --partition-table partitions.csv --target-app-partition ota_0 firmware.bin 2>&1)"; then
            echo "$out"
            echo "::error::cargo espflash save-image failed"
            exit 1
          fi
          echo "$out"
          line="$(grep 'App/part. size' <<< "$out")"
          used="$(sed -E 's/.*size: *([0-9,]+)\/.*/\1/; s/,//g' <<< "$line")"
          slot="$(sed -E 's/.*\/([0-9,]+) bytes.*/\1/; s/,//g' <<< "$line")"
          percent=$(( used * 100 / slot ))
          echo "### Firmware size: ${used} of ${slot} bytes (${percent}% of an OTA slot)" >> "$GITHUB_STEP_SUMMARY"
          if (( percent > MAX_SLOT_PERCENT )); then
            echo "::error::The image takes ${percent}% of an OTA slot (limit ${MAX_SLOT_PERCENT}%)."
            exit 1
          fi
